<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#541B2B">
<title>Redirecionando para o WhatsApp — Lingrens Advocacia</title>

<!-- GOOGLE TAG (Google Ads) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-17873334808"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'AW-17873334808');
  gtag('config', 'AW-18469875165');
</script>

<style>
  :root { --vinho:#541B2B; --vinho-2:#6E2539; --creme:#FAF6F2; --texto:#2B1A1F; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--creme); color:var(--texto);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding:24px 16px; text-align:center;
  }
  .card {
    background:#fff; max-width:420px; width:100%; border-radius:16px;
    padding:40px 28px; box-shadow:0 10px 30px rgba(84,27,43,.12);
    border-top:5px solid var(--vinho);
  }
  .spinner {
    width:48px; height:48px; margin:0 auto 24px; border-radius:50%;
    border:4px solid #EBDDE0; border-top-color:var(--vinho);
    animation:gira .9s linear infinite;
  }
  @keyframes gira { to { transform:rotate(360deg); } }
  h1 { font-size:1.35rem; color:var(--vinho); margin-bottom:10px; }
  p { font-size:.98rem; line-height:1.5; color:#5a4a4f; margin-bottom:24px; }
  a.btn {
    display:inline-block; background:var(--vinho); color:#fff; text-decoration:none;
    padding:14px 26px; border-radius:999px; font-weight:600; font-size:1rem;
  }
  a.btn:hover { background:var(--vinho-2); }
  .rodape { margin-top:22px; font-size:.8rem; color:#8a7a7f; }
</style>
</head>
<body>
  <div class="card">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Abrindo o WhatsApp…</h1>
    <p>Você será direcionado para conversar com a Lingrens Advocacia. Se não abrir automaticamente, toque no botão abaixo.</p>
    <a class="btn" id="btn-wpp" href="#">Abrir WhatsApp</a>
    <div class="rodape">Lingrens Advocacia · Direito Trabalhista</div>
  </div>

<script>
  var NUMERO   = '5513991605813';
  var MENSAGEM = 'Olá! Vim pelo site e gostaria de falar sobre uma situação trabalhista.';
  var WPP_URL  = 'https://wa.me/' + NUMERO + '?text=' + encodeURIComponent(MENSAGEM);

  document.getElementById('btn-wpp').href = WPP_URL;

  var redirecionou = false;
  function ir() {
    if (redirecionou) return;
    redirecionou = true;
    window.location.replace(WPP_URL);
  }

  // Conversão de Contato (Google Ads) — dispara e só então redireciona
  try {
    gtag('event', 'conversion', {
      'send_to': 'AW-17873334808/ZNTrCM6o__ocEJjk1cpC',
      'event_callback': ir
    });
    // Segunda conta do Google Ads (AW-18469875165)
    gtag('event', 'conversion', {
      'send_to': 'AW-18469875165/yo2jCP2AvYIdEN3bj-dE',
      'value': 1.0,
      'currency': 'BRL'
    });
  } catch (e) {}

  // Redireciona mesmo se a tag demorar ou for bloqueada
  setTimeout(ir, 1500);
</script>
</body>
</html>
